name: Daily Japan Digest

on:
  schedule:
    # GitHub's scheduled crons are best-effort — it routinely delays or DROPS a
    # given slot (this repo has had whole mornings skipped). So instead of one
    # send time we fire SEVERAL staggered attempts across the delivery window.
    # This is safe because the once-a-day guard (last_sent.txt, set only after a
    # successful send) makes every attempt after the first a no-op, and the
    # concurrency group serializes any overlap — so recipients still get exactly
    # ONE email, on the earliest slot GitHub actually honors. All times are UTC;
    # ET shown for DST (subtract 1h in standard time). Off the congested :00/:30.
    - cron: '17 10 * * *'   # 6:17 AM ET — primary
    - cron: '47 10 * * *'   # 6:47 AM ET — catch-up 1
    - cron: '27 11 * * *'   # 7:27 AM ET — catch-up 2
    - cron: '27 12 * * *'   # 8:27 AM ET — catch-up 3
    - cron: '27 13 * * *'   # 9:27 AM ET — catch-up 4
    - cron: '27 14 * * *'   # 10:27 AM ET — final backstop
  # A push to this branch runs a dry collection — no model call, no email —
  # unless the commit message carries [live-send] or [test-send]. That is the
  # same guard the China brief uses, and it exists because workflow_dispatch
  # needs the Actions UI: without it there is no way to start a run from a
  # terminal or an API client that lacks actions:write.
  push:
    branches: [claude/cool-gauss-d6swm9]
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Send even if validation fails. Use only when you have read the findings and accept them.'
        type: boolean
        default: false
      dry_run:
        description: 'Collection only — no API key needed. Scrapes all feeds + market data, uploads collected.json. Skips digest/render/send.'
        type: boolean
        default: false
      send_to:
        description: >-
          Test send: deliver this run to these addresses only, comma-separated.
          Leave blank for the normal distribution list. Implies live_send, and
          skips the archive and tracker writes so a test leaves no trace.
        type: string
        default: ''
      live_send:
        description: 'Actually send the email. Leave false for a safe test run (collect + digest + render only; HTML uploaded as an artifact, no email, no archive commit).'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: japan-digest
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      pages_ready: ${{ steps.configure_pages.outcome == 'success' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Before the model is called and before anything is sent: this edition
      # shipped a NameError in the footer and a fail-open validation gate
      # because nothing ran between install and send.
      - name: Offline smoke tests
        run: python3 smoke_test.py

      - name: Install Chromium (for print PDF)
        run: python -m playwright install --with-deps chromium

      # Idempotency guard: on a scheduled run, skip only if today's email (ET) was
      # already SENT — tracked by last_sent.txt, which the pipeline writes ONLY
      # after a successful send. Keying on the send (not the archive, which is
      # written before the email goes out) makes the daily send exactly-once:
      # the catch-up cron no-ops when the primary sent, and does the full send
      # when the primary was dropped OR sent-but-failed. Manual dispatch always
      # runs.
      - name: Skip guard (avoid double-send on catch-up)
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        id: guard
        run: |
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          LAST_SENT=$(tr -d '[:space:]' < last_sent.txt 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "push" ]; then
            if printf '%s' "$COMMIT_MSG" | grep -q '\[live-send\]'; then
              echo "::notice::Push tagged [live-send]: full pipeline, live send."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            elif printf '%s' "$COMMIT_MSG" | grep -q '\[test-send\]'; then
              echo "::notice::Push tagged [test-send]: full pipeline, test address only."
              echo "should_run=test" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Push without a send tag: dry collection only."
              echo "should_run=dry" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$LAST_SENT" = "$TODAY" ]; then
            echo "::notice::Today's edition ($TODAY) already sent — skipping (catch-up no-op)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        if: ${{ steps.guard.outputs.should_run != 'false' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          WEB_URL: ${{ vars.WEB_URL }}
          # Trust the live Wikipedia cabinet-approval fetch over the static baseline.
          # Safe by construction: run.py only uses it if it returns >=3 houses AND
          # agrees with the hand-verified baseline on overlapping pollsters, else it
          # falls back to the baseline. Set repo variable TRUST_WIKI_POLLS=0 to disable.
          TRUST_WIKI_POLLS: ${{ vars.TRUST_WIKI_POLLS || '1' }}
          TEST_SEND_TO: ${{ vars.TEST_SEND_TO || 'alim@csis.org' }}
        run: |
          if [ "${{ steps.guard.outputs.should_run }}" = "dry" ]; then
            echo "::notice::Push without a send tag — collection only."
            python run.py --dry-run
          elif [ "${{ steps.guard.outputs.should_run }}" = "test" ]; then
            echo "::notice::Push tagged [test-send] — full pipeline to the test address only."
            python run.py --send-to "${TEST_SEND_TO:-alim@csis.org}" --no-archive
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "::notice::Push tagged [live-send] — full pipeline, live send."
            # Not --force-send. The gate blocks a brief that failed validation
            # and that is the point of it; forcing belongs behind the dispatch
            # input, where a person has read the findings and accepted them.
            python run.py
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::DRY RUN — collection only (no API key required). Skips digest/render/send."
            python run.py --dry-run
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.send_to }}" ]; then
            echo "::notice::TEST SEND to ${{ inputs.send_to }} — no archive, no tracker writes."
            python run.py --send-to "${{ inputs.send_to }}" --no-archive
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.live_send }}" != "true" ]; then
            echo "::notice::TEST RUN — collect + digest + render only (no email, no archive)."
            python run.py --no-send --no-archive
          else
            python run.py
          fi

      - name: Upload rendered digest (artifact)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-output
          path: |
            collected.json
            digest.html
            digest.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit tracker state + archive
        if: ${{ (github.event_name == 'schedule' || inputs.live_send == true || steps.guard.outputs.should_run == 'true' && github.event_name == 'push') && steps.guard.outputs.should_run == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pm_tracker.json region_tracker.json published_ledger.json poll_history.json last_sent.txt public/ README.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"; exit 0
          fi
          git commit -m "Daily Japan Digest run $(date -u +%Y-%m-%d)"
          # The branch can move between checkout and here (a merge, another run).
          # A bare push then fails with "fetch first" and the archive is dropped.
          # Rebase our single archive commit onto the remote tip and retry.
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed archive on attempt ${attempt}"; exit 0
            fi
            echo "Push rejected — rebasing on origin/${BRANCH} (attempt ${attempt})"
            git fetch origin "${BRANCH}" || true
            git rebase "origin/${BRANCH}" || { git rebase --abort || true; }
            sleep $((attempt * 2))
          done
          echo "::warning::Could not push archive commit after 4 attempts"

      # Publish the public/ archive (HTML + PDF) to GitHub Pages. configure-pages
      # with enablement:true tries to turn Pages on automatically, but the default
      # GITHUB_TOKEN can't create a Pages site ("Resource not accessible by
      # integration"), so we hand it the PAT. If Pages still isn't enabled, these
      # steps are marked continue-on-error so they never fail an otherwise
      # successful send — enable Pages once by hand (Settings → Pages → Source:
      # GitHub Actions) and every run deploys thereafter.
      - name: Configure Pages
        id: configure_pages
        if: ${{ (github.event_name == 'schedule' || inputs.live_send == true || steps.guard.outputs.should_run == 'true' && github.event_name == 'push') && steps.guard.outputs.should_run == 'true' }}
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Upload Pages artifact
        if: ${{ (github.event_name == 'schedule' || inputs.live_send == true || steps.guard.outputs.should_run == 'true' && github.event_name == 'push') && steps.guard.outputs.should_run == 'true' && steps.configure_pages.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    needs: build-and-send
    if: ${{ (github.event_name == 'schedule' || inputs.live_send == true || github.event_name == 'push') && needs.build-and-send.outputs.should_run == 'true' && needs.build-and-send.outputs.pages_ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
